<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MAGGAR.io — Grow your cell, rule the arena</title>
  <meta name="description" content="An offline browser cell game full of humanlike AI rivals. School friendly, no ads.">
  <meta name="theme-color" content="#07070f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2300e5ff' stroke='%23008fa3' stroke-width='5'/%3E%3Ccircle cx='46' cy='18' r='8' fill='%23ff3fd0'/%3E%3C/svg%3E">
  <!-- Only external source: fonts via jsDelivr (falls back to system fonts if blocked) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/500.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/700.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/800.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/orbitron@5/900.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Game area"></canvas>

  <!-- ============ IN-GAME HUD ============ -->
  <div id="hud" class="hidden">
    <div id="hud-tl">
      <div id="score" class="hud-box"><span class="lbl" data-i18n="ui.score">Score</span> <b id="score-val">0</b></div>
      <div id="hud-stats" class="hud-mini"></div>
      <div id="killfeed"></div>
    </div>

    <div id="leaderboard" class="hud-box">
      <h3 id="lb-title">Leaderboard</h3>
      <canvas id="team-pie" width="120" height="120" class="hidden"></canvas>
      <ol id="lb-list"></ol>
    </div>

    <div id="mode-bar" class="hidden"></div>
    <div id="event-banner" class="hidden"></div>
    <div id="announce"></div>
    <div id="effects"></div>

    <div id="chat">
      <div id="chat-log" aria-live="polite"></div>
      <div id="quickchat" class="hidden"></div>
      <div id="chat-hint" data-i18n-html="ui.chatHint"></div>
    </div>

    <div id="bottom-right">
      <button id="power-slot" class="empty" data-i18n-title="ui.powerTitle">
        <span id="power-icon">·</span>
        <span id="power-name"></span>
        <kbd>F</kbd>
      </button>
      <canvas id="minimap" width="200" height="200"></canvas>
    </div>

    <div id="touch-ui" class="hidden">
      <button id="tb-chat" class="tbtn small" aria-label="Chat">💬</button>
      <button id="tb-power" class="tbtn" aria-label="Power">⚡</button>
      <button id="tb-eject" class="tbtn" aria-label="Eject">W</button>
      <button id="tb-split" class="tbtn big" aria-label="Split" data-i18n="ui.splitBtn">SPLIT</button>
    </div>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="pause-btn" aria-label="Pause">❚❚</button>
  </div>

  <!-- ============ MAIN MENU ============ -->
  <div id="menu" class="overlay">
    <div class="menu-grid">
      <aside class="panel side" id="menu-left">
        <div id="profile-card"></div>
        <div class="section-title"><span data-i18n="ui.dailyMissions"></span> <span id="mission-reset" class="muted"></span></div>
        <div id="missions"></div>
        <div class="btn-row">
          <button class="btn ghost" data-open="profile" data-i18n="ui.profile"></button>
          <button class="btn ghost" data-open="achievements" data-i18n="ui.achievements"></button>
        </div>
      </aside>

      <main class="panel center" id="menu-center">
        <div id="lang-switch" class="lang-switch" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="tr">TR</button></div>
        <h1 class="logo" aria-label="MAGGAR.io"><span class="l1">MAGGAR</span><span class="l2">.io</span></h1>
        <p class="tagline" data-i18n="ui.tagline"></p>

        <div class="nick-row">
          <button id="skin-btn" class="skin-btn" data-i18n-title="ui.pickLook"></button>
          <input id="nick" maxlength="15" data-i18n-ph="ui.nickPh" autocomplete="off" spellcheck="false" aria-label="Nickname">
        </div>
        <div id="nick-warn" class="warn hidden"></div>

        <button id="play-btn" class="btn play" data-i18n="ui.play">PLAY</button>
        <div class="btn-row">
          <button id="spectate-btn" class="btn ghost small" data-i18n="ui.spectate"></button>
          <button class="btn ghost small" data-open="settings" data-i18n="ui.settings"></button>
          <button class="btn ghost small" data-open="help" data-i18n="ui.howTo"></button>
        </div>

        <div class="section-title" data-i18n="ui.gameMode"></div>
        <div id="modes" class="modes"></div>

        <div class="options-row">
          <label class="toggle" data-i18n-title="ui.rankedTitle">
            <input type="checkbox" id="ranked-toggle"><span class="slider"></span><span data-i18n="ui.ranked"></span>
          </label>
          <label class="select-wrap">
            <span data-i18n="ui.difficulty"></span>
            <select id="difficulty"></select>
          </label>
          <label class="select-wrap" id="arena-wrap">
            <span data-i18n="ui.arena"></span>
            <select id="arena-select"></select>
          </label>
        </div>
        <div id="mode-info" class="mode-info"></div>
      </main>

      <aside class="panel side" id="menu-right">
        <div class="section-title" data-i18n="ui.controls"></div>
        <ul class="keys" data-i18n-html="ui.keysHtml"></ul>
        <div class="section-title" data-i18n="ui.whatsInside"></div>
        <ul class="feature-list" data-i18n-html="ui.featuresHtml"></ul>
        <div id="live-info" class="live-info"></div>
      </aside>
    </div>
    <footer class="menu-foot" data-i18n="ui.footer"></footer>
  </div>

  <!-- ============ DEATH / MATCH END ============ -->
  <div id="death" class="overlay hidden">
    <div class="panel death-card">
      <h2 id="death-title"></h2>
      <p id="death-sub" class="muted"></p>
      <div id="death-stats" class="stat-grid"></div>
      <div id="death-rewards"></div>
      <div class="btn-row">
        <button id="again-btn" class="btn play small-play" data-i18n="ui.playAgain"></button>
      </div>
      <div class="btn-row">
        <button id="watch-btn" class="btn ghost small" data-i18n="ui.watch"></button>
        <button id="menu-btn" class="btn ghost small" data-i18n="ui.mainMenu"></button>
      </div>
    </div>
  </div>

  <!-- ============ PAUSE ============ -->
  <div id="pause" class="overlay hidden">
    <div class="panel pause-card">
      <h2 data-i18n="ui.paused"></h2>
      <button id="resume-btn" class="btn play small-play" data-i18n="ui.resume"></button>
      <div class="btn-row">
        <button class="btn ghost small" data-open="settings" data-i18n="ui.settings"></button>
        <button class="btn ghost small" data-open="help" data-i18n="ui.help"></button>
      </div>
      <button id="quit-btn" class="btn danger small" data-i18n="ui.quit"></button>
    </div>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="panel modal-card">
      <button class="modal-close" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="spectate-bar" class="hidden"><span id="spectate-name"></span><button id="spectate-exit" class="btn ghost small" data-i18n="ui.backToMenu"></button></div>

  <noscript><div class="noscript">This game needs JavaScript. / Bu oyun için JavaScript gerekiyor.</div></noscript>

  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/util.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/config.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/names.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/filter.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/progress.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/audio.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/core/input.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/game/entities.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/game/world.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/game/modes.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/game/events.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/game/ai.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/render/skins.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/render/renderer.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/ui/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/createzalma6z/maggar@main/js/main.js"></script>
</body>
</html>
